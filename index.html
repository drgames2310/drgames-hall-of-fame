<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D_RGames Hall of Fame</title>
<style>
body{background:#160d25;color:white;font-family:Arial;text-align:center;padding:25px}
h1{color:#c58cff}
.player{background:#2b1940;margin:10px auto;padding:15px;border-radius:10px;max-width:450px;font-size:20px}
</style>
</head>
<body>
<h1>🏆 D_RGames Hall of Fame</h1>
<div id="ranking">Φόρτωση...</div>
<script>
fetch('./halloffame.json')
.then(r=>r.json())
.then(players=>{
 const box=document.getElementById('ranking');
 if(!players.length){box.textContent='Δεν υπάρχουν ακόμη καταχωρήσεις.';return;}
 box.innerHTML=players.slice(0,5).map((p,i)=>
 <div class="player">${i+1}. ${p.username} — ${p.spent} πόντοι</div>
 ).join('');
})
.catch(()=>document.getElementById('ranking').textContent='Δεν ήταν δυνατή η φόρτωση.');
</script>
</body>
</html>
