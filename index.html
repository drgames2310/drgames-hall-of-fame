<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D_RGames Hall of Fame</title>
<style>
body{background:#160d25;color:white;font-family:Arial;text-align:center;padding:25px}
h1{color:#c58cff}
.player{background:#2b1940;margin:10px auto;padding:15px;border-radius:10px;max-width:450px;font-size:20px}
</style>
</head>
<body>
<h1>🏆 D_RGames Hall of Fame</h1>
<div id="ranking">Φόρτωση...</div>
<script>
async function loadHallOfFame() {
  const box = document.getElementById('ranking');

  try {
    const response = await fetch('./halloffame.json?v=' + Date.now());

    if (!response.ok) {
      throw new Error('HTTP ' + response.status);
    }

    const players = await response.json();
    box.innerHTML = '';

    if (!players.length) {
      box.textContent = 'Δεν υπάρχουν ακόμη καταχωρήσεις.';
      return;
    }

    players.slice(0, 5).forEach((p, i) => {
      const item = document.createElement('div');
      item.className = 'player';
      item.textContent = (i + 1) + '. ' + p.username + ' — ' + p.spent + ' πόντοι';
      box.appendChild(item);
    });

  } catch (error) {
    box.textContent = 'Σφάλμα φόρτωσης: ' + error.message;
  }
}

loadHallOfFame();
</script>
</body>
</html>
